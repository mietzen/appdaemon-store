site_name: AppDaemon Store
site_description: Manage AppDaemon apps from GitHub repositories for Home Assistant OS and Docker Compose

repo_url: https://github.com/mietzen/appdaemon-store
repo_name: mietzen/appdaemon-store

theme:
  name: material
  icon:
    logo: material/store
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3.12/objects.inv
          options:
            docstring_style: numpy
            merge_init_into_class: true
            show_signature: false
            members_order: source

watch:
  - docs
  - appdaemon_store

nav:
  - About: index.md
  - Changelog: changelog.md
  - Authors: authors.md
  - License: license.md
  - Reference: reference.md
  - Constants: constants.md
